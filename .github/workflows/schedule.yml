name: Refresh schedule

# Football happens Thursday to Monday, plus Tuesday and Wednesday evenings for
# the Champions League. Running overnight or on a quiet Wednesday afternoon
# would only burn minutes confirming nothing had changed.
#
# Times are UTC, which GitHub cron always is.
on:
  schedule:
    - cron: "*/30 11-23 * * 4,5,6,0,1"   # Thu–Mon, daytime and evening
    - cron: "*/30 19-23 * * 2,3"         # Tue/Wed evenings, for the UCL
  workflow_dispatch:                      # and on demand

concurrency:
  group: refresh-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only what the fetch actually needs. The schedule path touches no
      # dataframes and no plotting, so installing the app's full requirements
      # would add a minute a run for a stack nothing here calls.
      - run: pip install --quiet "curl_cffi>=0.7"

      # Every run started failing at Fetch, and the logs are admin-only while
      # step names and conclusions are public. This lights up exactly one of
      # three named steps, so the verdict is readable from the REST API
      # without credentials. Delete it once the cause is settled.
      - name: Probe WhoScored
        id: probe
        continue-on-error: true
        env:
          TRAZADO_PROXY: ${{ secrets.TRAZADO_PROXY }}
        run: python scripts/probe.py

      - name: "verdict - reachable from this runner (HTTP 200)"
        if: steps.probe.outputs.verdict == 'ok'
        run: echo reachable
      - name: "verdict - address refused (403 or 429)"
        if: steps.probe.outputs.verdict == 'refused'
        run: echo refused
      - name: "verdict - transport or other failure"
        if: steps.probe.outputs.verdict == 'other'
        run: echo other

      # Confirmed: WhoScored refuses this runner's address outright, so a
      # direct fetch from here cannot work no matter how patiently it retries.
      # lib/http already reads TRAZADO_PROXY, so adding a repository secret of
      # that name is the whole fix -- and until one exists this is an empty
      # string and the step behaves exactly as it does today.
      - name: Fetch
        env:
          TRAZADO_PROXY: ${{ secrets.TRAZADO_PROXY }}
        run: python scripts/fetch_schedule.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- data/schedule.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "Refresh schedule ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
